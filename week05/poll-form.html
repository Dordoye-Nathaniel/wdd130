<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathaniel Dordoye | WDD 130</title>
    <meta name="description"
      content="This is a homepage describing my profile as a Software Engineer">
    <meta name="author" content="Nathaniel Dordoye">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname">Fullname:</label>
                <input type="text" name="fullname" id="fullname" required>
                <label for="useremail">Email Address:</label>
                <input type="text" id="useremail" name="usermail" required>
            </fieldset>

            <!-- <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select> -->

            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is your favorite browser?</label>
                <select name="brower" id="browser">
                    <option value="Chrome">Chrome</option>
                    <option value="Edge">Edge</option>
                    <option value="Safari">Safari</option>
                    <option value="Opera Mini">Opera MIni</option>
                    <option value="Other">Other</option>
                </select>
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet">
                <label for="feedback">List the places you have lived?</label>
                <textarea name="feedback" id="feedback" rows="5"
                  placeholder="Accra, Kumasi, America, Amsterdam"></textarea>
            </fieldset>
            <fieldset>
                <label for="submit"></label>
                <button type="submit" name="submit" id="submit" aria-placeholder="Submit Poll">
            </fieldset>

        </form>
    </main>
    <footer>
        <p>©2026 | Author: Klenam | Email: @ndordoye@gmail.com | HTML FORMS |</p>
    </footer>

</body>
